language = "C"
include_guard = "WATOOTS_H_"
cpp_compat = true
documentation = true
documentation_style = "c99"
tab_width = 2
line_length = 80
no_includes = false
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h"]

autogen_warning = """
// Generated by cbindgen from crates/host-capi/src/lib.rs. Do not edit by hand:
// `cargo build -p watoots-capi` rewrites this file in place.
"""

header = """
// NOLINTBEGIN(readability-identifier-naming, modernize-use-using,
//             modernize-macro-to-enum, cppcoreguidelines-macro-to-enum,
//             cppcoreguidelines-use-enum-class, performance-enum-size)
// This file is C, and the checks above are C++-only advice a C ABI header
// cannot take. Naming is `wt_` snake_case per ADR-0001 rather than the Google
// C++ naming that watoots.hpp follows.

// A typed WIT value. Opaque: build one with a `wt_val_*` constructor and read
// it with a `wt_val_as_*` accessor. Declared here by hand because the Rust
// struct is `repr(transparent)` over wasmtime's `Val`, which cbindgen would
// otherwise render as a typedef of a type this header has never heard of.
typedef struct wt_val_t wt_val_t;"""

trailer = """
// NOLINTEND(readability-identifier-naming, modernize-use-using,
//           modernize-macro-to-enum, cppcoreguidelines-macro-to-enum,
//           cppcoreguidelines-use-enum-class, performance-enum-size)"""

[export]
prefix = ""
exclude = ["wt_val_t"]

[enum]
prefix_with_name = false

[parse]
parse_deps = false
