[package]
name = "watoots-capi"
description = "C API for watoots, the sandboxed plugin host for native applications on the WebAssembly component model."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
# staticlib for the CMake package consumers link; cdylib for anyone who wants a
# shared object; rlib so our own tests can use the crate.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
watoots = { version = "0.0.0", path = "../host" }

[build-dependencies]
cbindgen = "0.29.4"
