[package]
name = "watoots-cli"
description = "Command-line interface for watoots: inspect, run, record, and replay WebAssembly component plugins."
readme = "README.md"
documentation = "https://docs.rs/watoots-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# The CLI is `watoots`, not `watoots-cli` (ADR-0001).
[[bin]]
name = "watoots"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
watoots = { version = "0.1.0", path = "../host" }
watoots-trace = { version = "0.1.0", path = "../trace" }

[dev-dependencies]
tempfile = "3.27.0"
