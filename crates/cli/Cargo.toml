[package]
name = "watoots-cli"
description = "Command-line interface for watoots: inspect, run, record, and replay WebAssembly component plugins."
readme = "README.md"
documentation = "https://docs.rs/watoots-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

# The CLI is `watoots`, not `watoots-cli` (ADR-0001).
[[bin]]
name = "watoots"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
watoots = { version = "0.2.0", path = "../host" }
# Same pin as crates/host: one wasmparser in the tree, not two. ADR-0007.
# `semver-check` is an opt-in feature and only the CLI needs it: it compares two
# WIT packages, which is a release-time question, not a plugin-loading one.
wit-component = { version = "0.254", features = ["semver-check"] }
wit-parser = "0.254"
watoots-trace = { version = "0.2.0", path = "../trace" }

[dev-dependencies]
tempfile = "3.27.0"
