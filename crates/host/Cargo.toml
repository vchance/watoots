[package]
name = "watoots"
description = "Sandboxed plugin host for native applications on the WebAssembly component model, built on Wasmtime."
readme = "README.md"
documentation = "https://docs.rs/watoots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bytesize = { version = "2.7.0", features = ["serde"] }
humantime-serde = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
toml = "1.1.4"
wasm-wave = "0.254"
# `call-hook` is not on by default and is what makes the profiler possible:
# it is the exact host<->guest transition signal ADR-0009 splits time with.
# `profiling` is already a default feature and supplies `GuestProfiler`.
wasmtime = { version = "48", features = ["wave", "call-hook"] }
# Pinned to the copy Wasmtime 48 already pulls in: a semver-incompatible
# version compiles a second wasmparser, and its Resolve and WorldId are then
# different types from the ones in Wasmtime's copy. See ADR-0007, and
# ADR-0004 for the identical constraint on wasm-wave.
wit-component = "0.254"
wit-parser = "0.254"
wasmtime-wasi = "48"

[dev-dependencies]
# Only the tests need WAT as *binary*: most pass the text straight to
# load_binary, which wasmtime assembles itself, but wit_component::targets
# embeds the component bytes and validates them.
wat = "1.258"
tempfile = "3.27.0"
proptest = "1.11.0"
