[package]
name = "watoots"
description = "Sandboxed plugin host for native applications on the WebAssembly component model, built on Wasmtime."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
bytesize = { version = "2.7.0", features = ["serde"] }
humantime-serde = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
toml = "1.1.4"
wasm-wave = "0.254"
wasmtime = { version = "48", features = ["wave"] }
wasmtime-wasi = "48"

[dev-dependencies]
tempfile = "3.27.0"
