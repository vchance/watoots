name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      # docs.rs will build these; a broken intra-doc link or a redundant one
      # should fail here first. It never ran here before and was failing.
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # The C header is generated by build.rs and committed, so a consumer needs
      # neither cargo nor cbindgen. This is what catches a forgotten
      # regeneration.
      - name: include/watoots.h is up to date
        run: |
          cargo build -p watoots-capi
          git diff --exit-code -- crates/host-capi/include/watoots.h

  # `rust-version` in Cargo.toml is a promise to anyone depending on watoots,
  # and every other job here runs on stable, so nothing was checking it. A
  # dependency bump can raise the real floor silently -- cranelift sets it
  # today -- and the first person to find out would otherwise be a consumer
  # whose build broke. `check` rather than `test`: this asks whether the code
  # compiles on the oldest toolchain we claim, which is the promise made.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$version" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  cpp:
    runs-on: ubuntu-latest
    env:
      # Both scripts honour these; pointing them at the versioned prefix also
      # gives tools/tidy.sh a matching clang++ and run-clang-tidy next door,
      # which is what it looks for.
      CLANG_FORMAT: /usr/lib/llvm-22/bin/clang-format
      CLANG_TIDY: /usr/lib/llvm-22/bin/clang-tidy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2

      # LLVM 22, pinned. Ubuntu's archive ships clang-format 18, and
      # `BasedOnStyle: Google` is not frozen across LLVM releases -- 18
      # reformats code that 22 and 23 both accept. `.clang-tidy` sets
      # `WarningsAsErrors: '*'`, so the check set has to be pinned for the
      # same reason. See docs/adr/0003-cpp-toolchain.md.
      - name: Install toolchain
        run: |
          set -eux
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-22 clang-format-22 clang-tidy-22
          "$CLANG_FORMAT" --version
          "$CLANG_TIDY" --version

      - run: tools/format.sh --check
      # Every guest a rustup toolchain can build. `rust` alone was the original
      # line, and it meant every host_cpp_asset.* and host_cpp_preview.* test
      # was silently skipped here -- they are gated on the component existing --
      # so CI ran 89 ctests while a developer's machine ran 113, and the
      # headline example's viewer had never run in CI at all.
      - run: tools/build-plugins.sh rust rust-asset rust-qoi rust-farbfeld
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev
      - run: tools/tidy.sh
      # The two demos are the README's story executed end to end, and each
      # exits non-zero if a step comes out wrong -- a bomb that decodes, a
      # tampered plugin that loads. Everything they need is already built by
      # this job. Without this step the story a reader follows could rot with
      # the badge still green.
      - run: tools/demo.sh
      - run: tools/demo-preview.sh

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      # The failure mode of a Rust-backed C API is handle lifetime, which unit
      # tests do not catch on their own. LeakSanitizer is Linux-only, which is
      # why this job exists rather than being left to a developer's machine.
      #
      # The example hosts are the real consumers of that API, and the previewer
      # is the one that parses untrusted input -- so they run under the
      # sanitizers too. "Does the viewer leak when a decode is refused" is
      # exactly the question this job exists to answer.
      - run: tools/build-plugins.sh rust rust-asset rust-qoi rust-farbfeld
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan
