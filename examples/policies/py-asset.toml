# Policy for examples/plugins/py-asset.
#
# Derived from `watoots inspect --imports --provide watoots:asset/log@0.1.0` on
# the built component, not from reading the source and not by copying
# py-lint.toml. Twelve imports come back denied by default, and the five lines
# below answer all of them:
#
#   wasi:clocks/wall-clock        CPython's startup, `time`, `os.stat`
#   wasi:clocks/monotonic-clock   ...covered by the same `"wall"`
#   wasi:cli/environment          CPython reads PYTHONHOME and friends
#   wasi:random/random            CPython seeds its hash randomisation
#   wasi:filesystem/types         the `lut` step opens a file itself
#   wasi:filesystem/preopens      ditto - one interface pair, one grant
#   wasi:sockets/instance-network the `socket` module, linked whether or not
#   wasi:sockets/{udp,tcp}        anyone imports it - see `net` below
#   wasi:sockets/{udp,tcp}-create-socket
#   wasi:sockets/ip-name-lookup
#
# Everything else the component imports is either ambient (`wasi:io`,
# `wasi:cli/std*`, `wasi:cli/exit`) or imported only for its types and has
# nothing callable in it - `wasi:sockets/network`, `watoots:asset/types` and
# `watoots:asset/manifest`. `watoots:asset/log` is not a manifest question at
# all: the application serves it with `host_func`, which is also what declares
# it to the grant check.
#
# This is the largest bill of the four guests, and none of it is `app.py`'s
# doing. The same arithmetic in Rust costs two lines.

[permissions]
clocks = "wall"         # CPython links both clocks; "wall" implies "monotonic"
env    = {}             # its startup reads the environment
random = true           # it seeds its hash randomisation before any code runs
net    = []             # interfaces linked by CPython; nothing reachable

# The one grant this example exists for.
#
# `lut` opens the table itself - here through wasi-libc's `open`, which does the
# preopen matching inside libc, exactly as it does for the C++ guest - so the
# plugin needs the filesystem, and it needs precisely one directory of it. WASI
# preopens are directories, not globs, so this admits the whole tree under
# `luts/` and nothing above it.
#
# Narrower than py-lint.toml, which grants `${plugin_dir}` whole. That guest
# grants a directory because CPython imports the interface and might touch
# something; this one grants a directory because there is a specific file in it,
# and the narrower grant is the one that can be justified.
#
# `${plugin_dir}` is the directory the component was loaded from, so the grant
# does not have to know where the repository was checked out. Drop this line and
# the *load* fails - before a pixel is touched and before `lut` has ever run -
# because the import is declared in the binary.
#
# What this line says is also what a `lut` step has to be handed: a directory is
# preopened under the same string it is granted as, and the guest cannot
# enumerate its preopens to resolve anything shorter. `asset.wit` spells that
# out under `operation.lut`.
#
# No `fs.write`: nothing here writes.
fs.read = ["${plugin_dir}/luts"]

[limits]
# py-lint's 256 MiB plus room for pixels: a source image and a `resize`
# destination are held at once, and the WIT caps a single destination at 32 MiB.
# A CPython image is most of this number before `app.py` allocates anything.
memory  = "320MiB"
# py-lint's budget. Every per-pixel loop below runs in the CPython interpreter,
# which is why this is ten times rust-asset's for identical arithmetic.
fuel    = 5_000_000_000
timeout = "30s"
