# Policy for examples/plugins/js-asset.
#
# Derived from `watoots inspect --imports --provide watoots:asset/log@0.1.0` on
# the built component, not from reading the source and not by copying
# js-lint.toml. Four imports come back denied by default:
#
#   wasi:clocks/wall-clock        StarlingMonkey links `Date`
#   wasi:clocks/monotonic-clock   ...and `performance.now()`
#   wasi:filesystem/types         the `lut` step opens a file itself
#   wasi:filesystem/preopens      ditto - one interface pair, one grant
#
# Everything else the component imports is either ambient (`wasi:io`,
# `wasi:cli/std*`, the terminal probes) or imported only for its types and has
# nothing callable in it - `watoots:asset/types` and `watoots:asset/manifest`
# are there because the world says `use types.{...}`. `watoots:asset/log` is not
# a manifest question at all: the application serves it with `host_func`, which
# is also what declares it to the grant check.
#
# `--disable http --disable random --disable fetch-event` in the build removes
# three more that ComponentizeJS includes by default. What is left is what the
# engine genuinely requires.

[permissions]
# One line, two denials: `"wall"` implies `"monotonic"`. Nothing in `asset.js`
# reads a clock; StarlingMonkey links both because a JavaScript engine without
# `Date` is not a JavaScript engine.
clocks = "wall"

# Not present, and the difference from js-lint.toml worth reading twice:
#
#   env = {}
#
# js-lint.toml grants the environment. This component does not import
# `wasi:cli/environment` at all, so the line would grant something nothing asks
# for - which is exactly the habit `watoots inspect` exists to break. Every
# other guest in this directory pays for `env` because its runtime's startup
# reads it; StarlingMonkey's does not.

# The one grant this example exists for.
#
# `lut` opens the table itself, so the plugin needs the filesystem - and it
# needs precisely one directory of it. WASI preopens are directories, not globs,
# so this admits the whole tree under `luts/` and nothing above it.
#
# Narrower than js-lint.toml, which grants `${plugin_dir}` whole: that guest is
# paying for StarlingMonkey's module resolution and has no file of its own to
# read, so the grant is as wide as the engine's need. Here there is a specific
# file, so the grant names the directory it is in - and the engine is satisfied
# by the same descriptor, because it never actually opens anything.
#
# `${plugin_dir}` is the directory the component was loaded from, so the grant
# does not have to know where the repository was checked out. Drop this line and
# the *load* fails - before a pixel is touched and before `lut` has ever run -
# because the import is declared in the binary.
#
# What this line says is also what a `lut` step has to be handed: a directory is
# preopened under the same string it is granted as, and the guest cannot
# enumerate its preopens to resolve anything shorter. `asset.wit` spells that
# out under `operation.lut`, and `resolveInPreopen` in `asset.js` is this
# guest's version of the prefix match Rust's `std::fs` and wasi-libc do inside
# `open` - the one piece of a C runtime a JavaScript guest has to write itself.
#
# No `fs.write`: nothing here writes.
fs.read = ["${plugin_dir}/luts"]

[limits]
# js-lint's 128 MiB plus rust-asset's 64 MiB, because this guest needs both: a
# SpiderMonkey heap, and room for a source image and a `resize` destination at
# once. The WIT caps a single destination at 32 MiB.
memory  = "192MiB"
# js-lint's budget. `resize` is the expensive step - one pass per destination
# pixel - and every pass here goes through an interpreter rather than a compiled
# loop, which is the whole reason this number is four times rust-asset's.
fuel    = 2_000_000_000
timeout = "10s"

# A plugin returning an image needs this raised, and the arithmetic is not
# obvious: `transfer` bounds what the *host* allocates lifting what the guest
# hands back, and on watoots' dynamic path a `list<u8>` costs 48 units per byte
# — `size_of::<Val>()`, not one. Wasmtime's 128MiB default therefore admits
# about 2.79MB of pixels, so a 966x966 image cannot come back while the same
# image goes in fine. 512MiB buys roughly 11MB of pixels, which covers a 1920x1920
# frame. It is a DoS ceiling, so raise it deliberately rather than by habit.
transfer = "512MiB"

# These samples are built from source by `tools/build-plugins.sh`, not shipped
# by a publisher, so there is nobody to verify against and no key to list. A
# real deployment lists `keys` here instead; this file has to say which it is,
# because "nobody thought about signing" and "we decided not to" must not look
# the same to whoever reviews the policy.
[signature]
required = false
