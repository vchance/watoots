# Its own workspace: a throwaway tool, not a member of the real one.
[workspace]

[package]
name = "make-preview-fixtures"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 WITH LLVM-exception"

[dependencies]
